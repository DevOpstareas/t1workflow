name: wf_pr
on:
#  push:
#    branches:
#      - release
  workflow_dispatch:
    inputs:
      entorno:
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  entorno:
      runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.entorno || 'dev' }}
    steps:
      - name: ejecucion_actions
        uses: DevOpstareas/t1action@main
        with:
          nombre: ${{ vars.NOMBRE }}
          apellido: ${{ vars.APELLIDO }}
          edad: ${{ vars.EDAD }}

      - name: Imprimir mensaje
        run: echo "El entorno es ${{ vars.AMBIENTE }}"

  ejecucion_rwf:
    uses: DevOpstareas/reusableworflow/.github/workflows/rwf_t1.yml@main
      with:
        nombre: 'Nancy'
