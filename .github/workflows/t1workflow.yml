name: wf_pr

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  entorno:
    runs-on: ubuntu-latest
    environment: ${{github.ref_name == 'develop' && 'dev' || github.ref_name == 'release' && 'qa' }}
    steps:}}
    steps:
      - name: Imprimir mensaje
        run: |
          echo "El entorno es ${{ vars.AMBIENTE }}"

  ejecucion_actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: invocaraction
        uses: DevOpstareas/t1action@main
        with:
            nombre:  ${{ vars.NOMBRE }}