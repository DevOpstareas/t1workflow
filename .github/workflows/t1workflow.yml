name: wf_pr
on:
#  push:
#    branches:
#      - release
  workflow_dispatch:
    inputs:
      entorno:
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  ejecucion_actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ github.event.inputs.entorno || 'dev' }}
    steps:
      - name: invocaraction
        uses: DevOpstareas/t1action@main
        with:
            nombre: ${{ vars.NOMBRE }}
            apellido: ${{ vars.APELLIDO }}
            edad: ${{ vars.EDAD }}

      - name: Imprimir mensaje
        run: echo "El entorno es ${{ vars.AMBIENTE }}"